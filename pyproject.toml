[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruresidual"
version = "0.1.0"
description = "Predicting sex-specific rewiring in the Drosophila connectome and characterizing what the fru/dsx genetic switch can't explain"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
