# Data lives OUTSIDE the repo (and outside OneDrive) on purpose: this repo
# is under OneDrive\Desktop, and OneDrive's sync filter driver throttles
# large binary writes to a crawl (~50KB/s observed on the 1GB connectome
# file). C:/FruResidualData is a plain local folder OneDrive never touches.
# If you move machines, just update these three paths.
paths:
  data_raw: C:/FruResidualData/raw
  data_interim: C:/FruResidualData/interim
  data_processed: C:/FruResidualData/processed

neuprint:
  server: neuprint.janelia.org
  dataset: "male-cns:v1.0"

# FlyWire and BANC source URLs are not configurable here on purpose: each
# client module owns its own URL as a documented constant (with provenance
# notes on how it was verified), since these are fixed upstream locations
# rather than per-environment settings.

# How fruDsx's confidence suffix is treated when deciding "does this neuron
# carry fru/dsx". One of: "any_positive" | "high_confidence_only".
#   any_positive         — fru/dsx_{high,low} + coexpress_{high,low} all count
#   high_confidence_only — only the _high variants count
# Phases 1, 3 and 4 read this value. Phase 0 ignores it and deliberately
# reports BOTH rules side by side, since the kill-gate decision has to be
# robust to this choice rather than depend on it (docs/project_plan.md
# section (e) risk #2). All committed results were produced with
# "any_positive"; changing this will change them, and the regression tests
# in tests/test_phase*_integration.py pin the "any_positive" numbers.
fru_dsx_aggregation: "any_positive"
