# Data lives OUTSIDE the repo (and outside OneDrive) on purpose: this repo
# is under OneDrive\Desktop, and OneDrive's sync filter driver throttles
# large binary writes to a crawl (~50KB/s observed on the 1GB connectome
# file). C:/FruResidualData is a plain local folder OneDrive never touches.
# If you move machines, just update these three paths.
paths:
  data_raw: C:/FruResidualData/raw
  data_interim: C:/FruResidualData/interim
  data_processed: C:/FruResidualData/processed

neuprint:
  server: neuprint.janelia.org
  dataset: "male-cns:v1.0"

flywire:
  annotations_repo: "flyconnectome/flywire_annotations"
  annotations_file: "supplemental_files/Supplemental_file1_neuron_annotations.tsv"

banc:
  meta_feather: "banc_888_meta.feather"

# Phase 0 gate: how per-type dimorphism aggregates onto per-neuron fru/dsx.
# One of: "high_confidence_only" | "any_positive" | "majority"
# See docs/project_plan.md section (e) risk #2 (granularity mismatch) —
# run the sensitivity analysis across all three before trusting the gate.
fru_dsx_aggregation: "high_confidence_only"
